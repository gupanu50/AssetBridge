<!DOCTYPE html>
<html>

<head>
	<title>TradingView Advanced Charts — Mobile (black)</title>

	<!-- Fix for iOS Safari zooming bug -->
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0" />

	<!-- TradingView Charting Library (local) -->
	<script type="text/javascript" src="charting_library/charting_library.standalone.js"></script>

	<!-- UDF datafeed bundle (local) -->
	<script type="text/javascript" src="datafeeds/udf/dist/bundle.js"></script>

	<script type="text/javascript">
		function getParameterByName(name) {
			name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
			var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
				results = regex.exec(location.search);
			return results === null
				? ""
				: decodeURIComponent(results[1].replace(/\+/g, " "));
		}

		function normalizeBaseUrl(raw) {
			// raw can be:
			// - "http://13.234.232.141:8001/tv"
			// - "https://domain.com/tv"
			// - "13.234.232.141:8001/tv"  (no scheme)
			if (!raw) return "";
			raw = String(raw).trim();

			// If already has scheme, keep it
			if (raw.startsWith("http://") || raw.startsWith("https://")) return raw;

			// If no scheme, default to http (because your backend is http)
			return "http://" + raw;
		}

		function initOnReady() {
			// Read params from RN WebView URL:
			// file:///.../mobile_black.html?dataUrl=http%3A%2F%2F13.234.232.141%3A8001%2Ftv&symbol=NIFTY50&interval=1D&lang=en
			var dataUrlParam = getParameterByName("dataUrl");
			var symbolParam = getParameterByName("symbol");
			var intervalParam = getParameterByName("interval");
			var langParam = getParameterByName("lang");

			// Defaults
			var datafeedUrl = "https://demo-feed-data.tradingview.com";
			var symbol = "NIFTY50";
			var interval = "1D";
			var lang = "en";

			// Apply overrides from query
			var normalized = normalizeBaseUrl(dataUrlParam);
			if (normalized) datafeedUrl = normalized;

			if (symbolParam) symbol = symbolParam;
			if (intervalParam) interval = intervalParam;
			if (langParam) lang = langParam;

			// IMPORTANT:
			// UDFCompatibleDatafeed expects base path like:
			// http://13.234.232.141:8001/tv
			// and it will call:
			// /tv/config, /tv/time, /tv/symbols, /tv/history, /tv/search ...
			window.tvWidget = new TradingView.widget({
				fullscreen: true,
				symbol: symbol,
				interval: interval,
				container: "tv_chart_container",

				// BEWARE: no trailing slash is expected
				datafeed: new Datafeeds.UDFCompatibleDatafeed(datafeedUrl, undefined, {
					maxResponseLength: 1000,
					expectedOrder: "latestFirst",
				}),

				library_path: "charting_library/",
				locale: lang,

				disabled_features: [],

				overrides: {
					"paneProperties.background": "#ffffff", // chart background
					"paneProperties.vertGridProperties.color": "#e6e6e6",
					"paneProperties.horzGridProperties.color": "#e6e6e6",
					"scalesProperties.textColor": "#000000",
				},
			});
		}

		window.addEventListener("DOMContentLoaded", initOnReady, false);
	</script>
</head>

<body style="margin: 0px;">
	<div id="tv_chart_container"></div>
</body>

</html>
